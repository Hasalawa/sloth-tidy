name: Release

# Push a tag like v1.0.0 and this builds a zip and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test before releasing
        run: python -m unittest -v
      - name: Build zip
        run: |
          mkdir -p dist
          zip -r "dist/sloth-tidy-${GITHUB_REF_NAME}.zip" \
            sloth_tidy.py make_mess.py test_sloth_tidy.py README.md LICENSE
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/sloth-tidy-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
